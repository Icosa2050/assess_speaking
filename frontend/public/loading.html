<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Vostavo</title>
    <script src="/theme-init.js"></script>
    <style>
      :root {
        --color-canvas: Canvas;
        --color-text: CanvasText;
      }
      html { min-height: 100%; background: var(--color-canvas); }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-content: center;
        padding: 2rem;
        font: 18px system-ui;
        background: var(--color-canvas);
        color: var(--color-text);
      }
      h1 { font-size: 36px; }
      p { max-width: 400px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Vostavo</h1>
      <p id="message">Preparing your speaking practice…</p>
    </main>
    <script>const copy={it:"Prepariamo la tua esercitazione…",de:"Deine Sprechübung wird vorbereitet…",fr:"Préparation de votre entraînement…",es:"Preparando tu práctica oral…"};document.getElementById('message').textContent=copy[navigator.language.split('-')[0]]||document.getElementById('message').textContent;</script>
  </body>
</html>
