[package]
name = "vostavo-desktop"
version = "0.1.0"
edition = "2021"
publish = false

[features]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2" }
libc = "0.2"
serde_json = "1"
serde = { version = "=1.0.228", features = ["derive"] }
sha2 = "=0.10.9"
aes-gcm = "=0.11.1"
rfd = { version = "0.15", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "=3.7.0", features = ["OSX_10_15"] }

[build-dependencies]
base64 = "0.22"
tauri-build = { version = "2" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
