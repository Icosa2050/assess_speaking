[package]
name = "vostavo-desktop"
version = "0.1.0"
edition = "2021"
publish = false

[features]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2" }
libc = "0.2"
serde_json = "1"
rfd = { version = "0.15", default-features = false }

[build-dependencies]
base64 = "0.22"
tauri-build = { version = "2" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
